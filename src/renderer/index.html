<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0d0f" />
    <title>Kodi</title>
    <style>
      /* --canvas is the boot background: the session hint may set it inline to
         the theme's exact color before the bundle's stylesheet even parses. */
      html[data-kodi-theme="dark"] { --canvas: #0c0d0f; }
      html[data-kodi-theme="light"] { --canvas: #f7f8fa; }
      @media (prefers-color-scheme: light) {
        html:not([data-kodi-theme]) { --canvas: #f7f8fa; }
      }
      html, body, #root { width: 100%; height: 100%; margin: 0; background: var(--canvas, #0c0d0f); }
      .boot-drag { height: 40px; -webkit-app-region: drag; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-drag"></div>
    </div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
